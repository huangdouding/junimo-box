<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#5C3A1E"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A67B5B"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A7C3F"/>
      <stop offset="100%" stop-color="#6FA85F"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EDDD"/>
      <stop offset="100%" stop-color="#EDE0CC"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#D4C4A8" stroke-width="4"/>

  <!-- Box body -->
  <rect x="136" y="216" width="240" height="180" rx="28" fill="url(#boxGrad)" stroke="#4A2E16" stroke-width="6"/>

  <!-- Box lid -->
  <rect x="136" y="164" width="240" height="52" rx="24" fill="url(#lidGrad)" stroke="#4A2E16" stroke-width="6"/>

  <!-- Lid highlight -->
  <rect x="160" y="176" width="192" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>

  <!-- Box face highlight -->
  <rect x="176" y="244" width="160" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>

  <!-- Leaf stem -->
  <path d="M256 164 L256 96" stroke="#4A7C3F" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Leaf left -->
  <path d="M256 120 C220 100 180 110 160 130 C180 140 220 140 256 130" fill="url(#leafGrad)" stroke="#3D6B32" stroke-width="4" stroke-linecap="round"/>

  <!-- Leaf right -->
  <path d="M256 110 C290 90 330 98 350 118 C330 128 290 128 256 120" fill="url(#leafGrad)" stroke="#3D6B32" stroke-width="4" stroke-linecap="round"/>

  <!-- Leaf vein left -->
  <path d="M256 125 C230 127 200 125 175 132" stroke="#3D6B32" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Leaf vein right -->
  <path d="M256 115 C280 117 310 114 335 122" stroke="#3D6B32" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Box label -->
  <rect x="196" y="300" width="120" height="40" rx="8" fill="rgba(255,248,233,0.9)" stroke="#D4C4A8" stroke-width="3"/>
  <text x="256" y="328" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#5C3A1E" text-anchor="middle" letter-spacing="2">JB</text>

  <!-- Subtle shadow at bottom -->
  <ellipse cx="256" cy="470" rx="140" ry="12" fill="rgba(60,36,18,0.10)"/>
</svg>
